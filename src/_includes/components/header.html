<header id="navigation">
  <div class="container">
    <a href="/" class="nav-mark" aria-label="Alan Huynh home">
      <span class="nav-mark-name">Alan Huynh</span>
      <span class="nav-mark-sub">ML &amp; Software</span>
    </a>
    <nav class="nav" role="navigation">
      <button class="toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="expanded">
        <div class="box" aria-hidden="true">
          <span class="line line1" aria-hidden="true"></span>
          <span class="line line2" aria-hidden="true"></span>
          <span class="line line3" aria-hidden="true"></span>
        </div>
      </button>
    <div class="ul-wrapper">
        <ul id="expanded" class="ul">
          <li class="li">
            <a href="/" class="li-link"> Home </a>
          </li>
          <li class="li"><a href="/#experience" class="li-link">Experience</a></li>
          <li class="li"><a href="/#talks" class="li-link">Talks</a></li>
          <li class="li">
            <a href="/project" class="li-link"> Projects </a>
          </li>
          <li class="li">
            <a href="/blog" class="li-link"> Blogs </a>
          </li>
        </ul>
      </div>
    </nav>
    </div>
    
  </div>
</header>
<script>
  (function() {
    var path = window.location.pathname.replace(/\/$/, '') || '/';
    document.querySelectorAll('#navigation .li-link').forEach(function(a) {
      var raw = a.getAttribute('href');
      if (raw.indexOf('#') !== -1) return; // on-page section links don't flag the page
      var href = raw.replace(/\/$/, '') || '/';
      if (href === path) a.classList.add('active');
    });
  })();
</script>
